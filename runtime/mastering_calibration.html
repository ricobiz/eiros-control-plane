<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>E-MASTER CAL</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--panel2:#111824;--text:#eef3f8;--muted:#7d8999;--line:#222c3a;--bad:#ff5d6c;--accent:#7aaaff;--ok:#54dda0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 82% at 50% -10%,#15223a 0%,var(--bg) 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));overflow:hidden}
.shell{width:min(100%,430px);border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(18,25,37,.97),rgba(8,11,17,.97));border-radius:30px;padding:18px 16px 16px;box-shadow:0 24px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.04)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.brand{font-size:12px;letter-spacing:.18em;font-weight:800}.step{font-size:10px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums}.safety{font-size:10px;line-height:1.4;text-align:center;color:#8793a4;margin:7px 10px 13px}
.stage{position:relative;display:grid;place-items:center;min-height:225px;border-radius:24px;background:radial-gradient(circle at 50% 44%,rgba(81,132,218,.18),transparent 44%),rgba(3,6,10,.46);border:1px solid rgba(255,255,255,.05);overflow:hidden}.ring{position:absolute;width:166px;height:166px;border-radius:50%;border:1px solid rgba(122,170,255,.22);box-shadow:0 0 55px rgba(86,137,222,.08);opacity:.55;transform:scale(.94)}.ring.playing{animation:pulse 1.05s ease-in-out infinite;border-color:rgba(122,170,255,.52);box-shadow:0 0 72px rgba(86,137,222,.18)}@keyframes pulse{50%{transform:scale(1.04);opacity:1}}
.readout{position:relative;text-align:center}.hz{font-size:54px;font-weight:680;letter-spacing:-.055em;line-height:.92;font-variant-numeric:tabular-nums}.unit{font-size:12px;color:#9ba8b9;margin-top:9px;letter-spacing:.14em}.db{font-size:20px;font-weight:650;margin-top:11px;font-variant-numeric:tabular-nums}.db small{font-size:10px;color:#687588;font-weight:650;letter-spacing:.08em}
.progress{height:4px;background:#151d29;border-radius:999px;overflow:hidden;margin:12px 5px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#648ccf,#9ebfff);border-radius:inherit;transition:width .08s linear}.hint{height:28px;display:grid;place-items:center;text-align:center;color:#8c98a8;font-size:10px;margin:5px 0 2px}
.limit{width:100%;height:82px;border:0;border-radius:22px;background:linear-gradient(180deg,#ff7581,#ef4a5a);box-shadow:0 12px 34px rgba(239,74,90,.16);color:#1a0608;font-size:18px;font-weight:900;letter-spacing:.12em;touch-action:manipulation}.limit:disabled{opacity:.25}.limit:active{transform:scale(.986)}
.controls{display:grid;grid-template-columns:1.2fr 1fr;gap:9px;margin-top:10px}.ctrl{height:43px;border-radius:14px;border:1px solid var(--line);background:#121925;color:#dce5ef;font-size:12px;font-weight:700}.ctrl.primary{background:#e8eef7;color:#111720;border-color:#e8eef7}.ctrl:active{transform:scale(.985)}
.results{display:none;margin-top:11px;padding:10px;border:1px solid rgba(84,221,160,.18);background:rgba(84,221,160,.05);border-radius:16px}.results.show{display:block}.resultsTitle{font-size:10px;color:#9fe7c4;margin-bottom:7px;letter-spacing:.08em}.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.cell{display:flex;justify-content:space-between;gap:7px;padding:5px 7px;border-radius:9px;background:rgba(255,255,255,.035);font-size:9px;color:#8794a5;font-variant-numeric:tabular-nums}.cell b{color:#dfe8f1;font-weight:700}.debug{text-align:center;color:#465163;font-size:9px;margin-top:7px;min-height:11px}
</style>
</head>
<body>
<main class="shell" aria-label="E-MASTER calibration">
  <div class="top"><div class="brand">E-MASTER CAL</div><div class="step" id="step">READY</div></div>
  <div class="safety">Fixed headphone volume. Each bass frequency rises from very low level. Tap LIMIT at the first audible choke/rattle. Stop immediately if uncomfortable.</div>
  <section class="stage">
    <div class="ring" id="ring"></div>
    <div class="readout">
      <div class="hz" id="hz">20</div><div class="unit">HZ</div>
      <div class="db" id="db">−50.0 <small>dBFS</small></div>
    </div>
  </section>
  <div class="progress"><div class="fill" id="fill"></div></div>
  <div class="hint" id="hint">Press START. The level will rise automatically.</div>
  <button class="limit" id="limit" disabled>LIMIT</button>
  <div class="controls"><button class="ctrl primary" id="start">START</button><button class="ctrl" id="reset">RESET</button></div>
  <div class="results" id="results"><div class="resultsTitle">CLEAN OUTPUT MAP</div><div class="map" id="map"></div></div>
  <div class="debug" id="debug"></div>
</main>
<script>
(() => {
  'use strict';

  const testFrequencies = [20,25,31.5,40,50,63,80,100,125,160,200];
  const cfg = {
    startDb: -50,
    safeCeilingDb: -18,
    rampDbPerSecond: 3.0,
    gapMs: 420,
    fadeMs: 45
  };
  const rampDbPerSecond = cfg.rampDbPerSecond;
  const safeCeilingDb = cfg.safeCeilingDb;

  const freshState = () => ({
    running:false,
    completed:false,
    index:0,
    currentHz:testFrequencies[0],
    currentDb:cfg.startDb,
    tonePlaying:false,
    frequencyMap:[],
    startedAt:0,
    message:'Press START. The level will rise automatically.'
  });

  let state = freshState();
  let audioCtx = null;
  let oscillator = null;
  let gainNode = null;
  let rafId = 0;
  let ceilingTimer = 0;
  let nextTimer = 0;
  let rampStartPerf = 0;

  const el = id => document.getElementById(id);
  const hzEl=el('hz'),dbEl=el('db'),stepEl=el('step'),ringEl=el('ring'),fillEl=el('fill');
  const hintEl=el('hint'),limitEl=el('limit'),startEl=el('start'),resetEl=el('reset');
  const resultsEl=el('results'),mapEl=el('map'),debugEl=el('debug');

  const dbToGain = db => 10 ** (db/20);
  const fmtHz = hz => Number.isInteger(hz) ? String(hz) : Number(hz).toFixed(1);
  const fmtDb = db => `${Number(db).toFixed(1).replace('-', '−')} dB`;
  const rampDurationSeconds = () => (cfg.safeCeilingDb-cfg.startDb)/cfg.rampDbPerSecond;

  function currentDbFromClock(){
    if(!state.tonePlaying || !rampStartPerf) return state.currentDb;
    const elapsed = Math.max(0,(performance.now()-rampStartPerf)/1000);
    return Math.min(cfg.safeCeilingDb,cfg.startDb + elapsed*cfg.rampDbPerSecond);
  }

  function renderMap(){
    if(!state.frequencyMap.length){resultsEl.classList.remove('show');mapEl.innerHTML='';return;}
    resultsEl.classList.add('show');
    mapEl.innerHTML = state.frequencyMap.map(row => {
      const value = row.status === 'limit' ? fmtDb(row.limitDb) : `≥ ${fmtDb(row.cleanThroughDb)}`;
      return `<div class="cell"><span>${fmtHz(row.hz)} Hz</span><b>${value}</b></div>`;
    }).join('');
  }

  function render(){
    state.currentDb = currentDbFromClock();
    hzEl.textContent=fmtHz(state.currentHz);
    dbEl.innerHTML=`${Number(state.currentDb).toFixed(1).replace('-', '−')} <small>dBFS</small>`;
    const p=Math.max(0,Math.min(1,(state.currentDb-cfg.startDb)/(cfg.safeCeilingDb-cfg.startDb)));
    fillEl.style.width=`${(p*100).toFixed(1)}%`;
    ringEl.classList.toggle('playing',state.tonePlaying);
    limitEl.disabled=!state.running || !state.tonePlaying || state.completed;
    startEl.textContent=state.running?'STOP':(state.completed?'DONE':'START');
    stepEl.textContent=state.completed?'DONE':`${Math.min(state.index+1,testFrequencies.length)}/${testFrequencies.length}`;
    hintEl.textContent=state.message;
    debugEl.textContent=`${state.frequencyMap.length}/${testFrequencies.length} captured · ceiling ${safeCeilingDb} dBFS`;
    renderMap();
  }

  function clearTimers(){
    if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    if(ceilingTimer){clearTimeout(ceilingTimer);ceilingTimer=0;}
    if(nextTimer){clearTimeout(nextTimer);nextTimer=0;}
  }

  function stopTone(){
    if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    if(ceilingTimer){clearTimeout(ceilingTimer);ceilingTimer=0;}
    if(gainNode && audioCtx){
      const now=audioCtx.currentTime;
      try{
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(Math.max(gainNode.gain.value,0.00001),now);
        gainNode.gain.exponentialRampToValueAtTime(0.00001,now+cfg.fadeMs/1000);
      }catch{}
    }
    if(oscillator && audioCtx){try{oscillator.stop(audioCtx.currentTime+cfg.fadeMs/1000+0.01);}catch{}}
    oscillator=null;gainNode=null;rampStartPerf=0;state.tonePlaying=false;
  }

  async function ensureAudio(){
    const AudioContextCtor=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextCtor) throw new Error('AudioContext unavailable');
    if(!audioCtx || audioCtx.state==='closed') audioCtx=new AudioContextCtor({latencyHint:'interactive'});
    if(audioCtx.state==='suspended') await audioCtx.resume();
  }

  function animate(){
    if(!state.tonePlaying) return;
    state.currentDb=currentDbFromClock();
    render();
    rafId=requestAnimationFrame(animate);
  }

  async function playFrequency(){
    if(!state.running || state.completed) return;
    await ensureAudio();
    stopTone();
    state.currentHz=testFrequencies[state.index];
    state.currentDb=cfg.startDb;
    state.message='Level rising… tap LIMIT at the first audible degradation.';

    const now=audioCtx.currentTime;
    const duration=rampDurationSeconds();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(state.currentHz,now);
    gain.gain.setValueAtTime(dbToGain(cfg.startDb),now);
    gain.gain.exponentialRampToValueAtTime(dbToGain(cfg.safeCeilingDb),now+duration);
    osc.connect(gain);gain.connect(audioCtx.destination);
    oscillator=osc;gainNode=gain;
    state.tonePlaying=true;
    rampStartPerf=performance.now();
    render();
    osc.start(now);
    rafId=requestAnimationFrame(animate);
    ceilingTimer=window.setTimeout(()=>captureCeiling(),Math.ceil(duration*1000)+60);
  }

  function captureCeiling(){
    if(!state.running || !state.tonePlaying || state.completed) return;
    state.currentDb=cfg.safeCeilingDb;
    state.frequencyMap.push({hz:state.currentHz,status:'clean-ceiling',cleanThroughDb:cfg.safeCeilingDb,at:Date.now()});
    stopTone();
    state.message=`${fmtHz(state.currentHz)} Hz stayed clean through the safe ceiling.`;
    advance();
  }

  function captureLimit(){
    if(!state.running || !state.tonePlaying || state.completed) return;
    state.currentDb=currentDbFromClock();
    const captured=Math.max(cfg.startDb,Math.min(cfg.safeCeilingDb,state.currentDb));
    state.frequencyMap.push({hz:state.currentHz,status:'limit',limitDb:captured,at:Date.now()});
    stopTone();
    state.message=`Limit captured: ${fmtHz(state.currentHz)} Hz @ ${fmtDb(captured)}.`;
    advance();
  }

  function advance(){
    state.index+=1;
    if(state.index>=testFrequencies.length){
      state.running=false;state.completed=true;state.tonePlaying=false;
      state.message='Bass capability map complete.';
      render();return;
    }
    state.currentHz=testFrequencies[state.index];
    state.currentDb=cfg.startDb;
    render();
    nextTimer=window.setTimeout(()=>{nextTimer=0;playFrequency().catch(handleError);},cfg.gapMs);
  }

  function handleError(err){
    stopTone();state.running=false;state.message=String(err&&err.message||err);render();
  }

  async function start(){
    if(state.completed) return;
    if(state.running){await stop(false);return;}
    try{
      await ensureAudio();
      state.running=true;state.message='Starting…';render();
      await playFrequency();
    }catch(err){handleError(err);}
  }

  async function stop(dispose=false){
    clearTimers();stopTone();state.running=false;state.message='Stopped.';
    if(dispose && audioCtx){try{await audioCtx.close();}catch{}audioCtx=null;}
    render();
  }

  async function reset(){
    await stop(true);state=freshState();render();
  }

  startEl.addEventListener('click',start);
  resetEl.addEventListener('click',reset);
  limitEl.addEventListener('click',captureLimit);
  document.addEventListener('visibilitychange',()=>{if(document.hidden) stop(true);});
  window.addEventListener('pagehide',()=>{stop(true);});

  window.EMasterCalibration={
    start,
    stop,
    reset,
    captureLimit,
    testFrequencies:[...testFrequencies],
    snapshot:()=>JSON.parse(JSON.stringify(state))
  };

  render();
})();
</script>
</body>
</html>
