.main{flex:1;min-height:0;display:flex;flex-direction:column}.messages{flex:1;min-height:0;overflow:auto;padding:11px 12px;display:flex;flex-direction:column;gap:8px;background:#0f0f10}.empty{margin:auto;color:var(--muted);font-size:12px}.msg{max-width:94%;padding:8px 10px;border:1px solid var(--line);border-radius:13px;background:#181819}.msg.rico{align-self:flex-end;border-color:rgba(25,195,125,.26)}.msg.chatgpt{align-self:flex-start;border-color:rgba(122,162,255,.28)}.msg.claude{align-self:flex-start;border-color:rgba(230,162,60,.25)}.msg.control{align-self:center;border-style:dashed}.meta{font-size:9px;color:var(--muted);margin-bottom:4px}.body{font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word}.composer{padding:9px 10px 10px;border-top:1px solid var(--line);background:#141415}.row{display:flex;gap:7px;margin-bottom:7px;align-items:center}.target{height:32px;flex:1;min-width:0;padding:0 9px;border:1px solid var(--line2);border-radius:11px;background:#202022;color:#e8e8ea;font-size:13px}.miniBtn{height:32px;padding:0 9px;border:1px solid var(--line2);border-radius:11px;background:#202022;color:#cfcfd3;font-size:13px}.callBtn{width:42px;padding:0;font-size:0}.callBtn::before{content:'☎';font-size:15px}.miniBtn.danger{color:#f5a3a3;border-color:rgba(239,68,68,.35)}.compose{display:grid;grid-template-columns:1fr 52px;gap:8px}textarea{min-height:48px;max-height:120px;resize:none;padding:10px 11px;border:1px solid var(--line2);border-radius:13px;background:#1b1b1d;color:var(--text);outline:none}textarea:focus{border-color:#56565c}.send{height:48px;border:1px solid #3d3d42;border-radius:13px;background:#252528;color:#f3f3f3;font-weight:760}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:9px;color:var(--muted)}.okText{color:var(--green)}.warnText{color:var(--amber)}.badText{color:#f5a3a3}.row.secondary{display:none!important}.room.controlsOpen .row.secondary{display:flex!important}.room.stale{opacity:.74}@media(max-width:560px){.room{height:670px;min-height:490px}.title{font-size:17px}.agent{min-width:132px}.row{display:grid;grid-template-columns:1fr auto auto}.target{grid-column:1/-1}.row.secondary{display:none!important;grid-template-columns:1fr 1fr 1fr}.room.controlsOpen .row.secondary{display:grid!important}.compose{grid-template-columns:1fr}.send{width:100%}}

body.mode-pip{width:64px!important;height:64px!important;overflow:hidden!important}

</style></head><body>

<script>
window.__EIROS_ROOM_BOOTSTRAP__=__EIROS_ROOM_BOOTSTRAP_JSON__;
(()=>{const boot=window.__EIROS_ROOM_BOOTSTRAP__||{},bridge=window.mcp||window.openai||{},$=id=>document.getElementById(id),room=$('room'),projectId=String(boot.projectId||'eiros-hub'),threadId=String(boot.threadId||'first-contact'),agentId=String(boot.agentId||'chatgpt'),host=String(boot.host||'chatgpt');const sessionId='room-'+agentId+'-'+Date.now()+'-'+Math.random().toString(16).slice(2);let timer=null,pulseTimer=null,busy=false,lastSig=null,lastEvent='',rpc=1,lastHeartbeat=0,current=true,noticeText='',noticeUntil=0,pulseLeader=false,pulseError='';const key=['eiros-room-active-v924',projectId,threadId,agentId].join(':'),killKey=['eiros-ui-kill',projectId,threadId].join(':'),roomPipKey=['eiros-room-pip-disabled-v924',projectId,threadId,agentId].join(':');const pinRoom=$('pinRoom'),roomBubble=$('roomBubble'),roomBubbleDot=$('roomBubbleDot');document.querySelectorAll('.ico').forEach(btn=>{const down=()=>btn.classList.add('pressing'),up=()=>setTimeout(()=>btn.classList.remove('pressing'),140);btn.addEventListener('pointerdown',down,{passive:true});btn.addEventListener('pointerup',up,{passive:true});btn.addEventListener('pointercancel',up,{passive:true});btn.addEventListener('touchstart',down,{passive:true});btn.addEventListener('touchend',up,{passive:true})});function buttonBusy(id,on){const b=$(id);if(!b)return;b.classList.toggle('busy',!!on);b.setAttribute('aria-busy',on?'true':'false')}function frameVisible(){return document.body.classList.contains('mode-pip')||currentDisplayMode()==='pip'||(innerWidth>=120&&innerHeight>=240)}function frameScore(){return (document.body.classList.contains('mode-pip')||currentDisplayMode()==='pip')?1000000000:(frameVisible()?innerWidth*innerHeight:0)}function readLease(){try{const raw=localStorage.getItem(key);if(!raw)return null;if(raw[0]==='{')return JSON.parse(raw);return{session_id:raw,score:0,claimed_at:0}}catch{return null}}function claimLease(){if(!frameVisible())return false;try{localStorage.setItem(key,JSON.stringify({sessi ate.now()+'-'+rpc++;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error(method+' timeout'))}},15000)})}async function callTool(name,args){for(const h of [window.openai,window.mcp]){if(h&&typeof h.callTool==='function')return h.callTool(name,args||{})}return rpcReq('tools/call',{name,arguments:args||{}})}async function trace(stage,detail=''){try{const snap={trace_stage:String(stage||''),trace_detail:String(detail||'').slice(0,500),trace_at:Date.now(),visibility:document.visibilityState,hidden:document.hidden,focused:document.hasFocus(),display_mode:currentDisplayMode(),active:active(),width:innerWidth,height:innerHeight};await callTool('room_telemetry_update',{widget_id:sessionId,widget_kind:'room',project_id:projectId,thread_id:threadId,status:'trace:'+String(stage||''),snapshot:snap,error:''});return true}catch{return false}}
async function post(text){
  const handles=[window.openai,window.mcp,bridge].filter(Boolean);

}function unwrap(v){return v?.structuredContent||v?.result?.structuredContent||v?.mcp_tool_result?.structuredContent||v||{}}function installPressFeedback(){document.querySelectorAll('button').forEach(btn=>{const down=()=>btn.classList.add('pressed'),up=()=>setTimeout(()=>btn.classList.remove('pressed'),110);btn.addEventListener('pointerdown',down,{passive:true});btn.addEventListener('pointerup',up,{passive:true});btn.addEventListener('pointercancel',up,{passive:true});btn.addEventListener('pointerleave',up,{passive:true});btn.addEventListener('touchstart',down,{passive:true});btn.addEventListener('touchend',up,{passive:true})})}
function tele(status,error){try{const snap={text:$('foot')?.textContent||'',state:$('state')?.textContent||'',lamps:$('lamps')?.textContent||'',agents:$('agents')?.textContent||'',messages:$('messages')?.textContent?.slice(0,500)||'',width:innerWidth,height:innerHeight,display_mode:currentDisplayMode(),active:active()};callTool('room_telemetry_update',{widget_id:sessionId,widget_kind:'room',project_id:projectId,thread_id:threadId,status,snapshot:snap,error:String(error||'')}).catch(()=>{})}catch{}}function lampClass(l){const st=String(l.state||'').toLowerCase();if(!l.ok)return'bad';if(st.includes('pending')||st.includes('job'))return'warn';return'ok'}function setState(t,c=''){$('state').textContent=t;$('state').className=c}function notice(text,state='READY',cls='okText',ms=6500){noticeText=String(text||'');noticeUntil=Date.now()+ms;$('foot').textContent=noticeText;setState(state,cls)}function who(id){return id==='chatgpt'?'ChatGPT / EIROS':id==='claude'?'Claude':id==='rico'?'Rico':id}function lampShort(n){return({Tunnel:'T',Worker:'W',Broker:'B',MCP:'M',Pulse:'P',Pair:'L',Queue:'Q',Git:'G'})[n]||String(n||'?').slice(0,1)}function renderLamps(system){const lamps=system?.lamps||[];$('lamps').innerHTML=lamps.map(l=>`<span class="lamp" title="${l.name}: ${String(l.state||'')} ${l.detail||''}"><span class="dot ${lampClass(l)}"></span>${lampShort(l.name)}<span class="lampstate">${String(l.state||'')}</span></span>`).join('');if(roomBubbleDot){const important=lamps.filter(l=>l.name==='Pulse'||l.name==='Pair'||l.name==='MCP'),bad=important.some(l=>!l.ok||String(l.state||'').toLowerCase().includes('offline')||String(l.state||'').toLowerCase().includes('missing')),warn=important.some(l=>String(l.state||'').toLowerCase().includes('pending')||String(l.state||'').toLowerCase().includes('starting')||String(l.state||'').toLowerCase().includes('degraded'));roomBubbleDot.className='roomBubbleDot '+(bad?'bad':warn?'warn':'ok')}}function renderAgents(hub){let list=(hub?.agents||[]).filter(a=>a.agent_id==='chatgpt'||a.agent_id==='claude');for(const id of ['chatgpt','claude'])if(!list.find(a=>a.agent_id===id))list.push({agent_id:id,activity:'offline',presence:'offline',seconds_since_seen:9999});$('agents').innerHTML=list.map(a=>{const state=String(a.activity||a.presence||'offline'),pending=Number(a.pending_calls||0)+Number(a.claimed_calls||0),c=(state==='idle'||state==='online')?'ok':(state==='offline')?'bad':'warn',label=state==='offline'?'off':pending?String(pending):'ready';return`<div class="agent ${c}"><div class="avatar">${a.agent_id==='claude'?'C':'E'}</div><div class="agentText"><div class="agentName">${who(a.agent_id)}</div><div class="agentMeta">${state.toUpperCase()} · ${a.active_session_count||0} sessions · ${Math.floor(Number(a.seconds_since_seen||0))}s</div></div><span class="agentState ${c}">${label}</span></div>`}).join('')}function renderMessages(history){const box=$('messages'),msgs=history?.messages||[],sig=msgs.map(m=>m.message_id+':'+m.status).join('|');if(sig===lastSig)return;lastSig=sig;box.innerHTML='';if(!msgs.length){box.innerHTML='<div class="empty">Room is empty.</div>';return}for(const m of msgs){const el=document.createElement('div');el.className='msg '+(m.kind==='control'?'control':String(m.from_agent||''));const meta=document.createElement('div');meta.className='meta';meta.textContent=`${who(m.from_agent)} → ${m.to_agent==='all'?'all':who(m.to_agent)} · #${m.seq} · ${String(m.status||'')}`;const body=document.createElement('div');body.className='body';body.textContent=String(m.content||'');el.append(meta,body);box.appendChild(el)}box.scrollTop=box.scrollHeight}async function heartbeat(){if(!active()){stale();return}const now=Date.now();if(now-lastHeartbeat<4500)return;lastHeartbeat=now;try{await callTool('room_heartbeat',{agent_id:agentId,session_id:sessionId,host,widget_version:String(boot.roomVersion||''),activity:'online·mode:'+currentDisplayMode()})}catch(e){$('foot').textContent='Heartbeat failed: '+(e.message||e)}}async function refresh(){if(!active()){stale();return}if(busy)return;busy=true;clearTimeout(timer);try{await heartbeat();const data=unwrap(await callTool('room_snapshot',{project_id:projectId,thread_id:threadId,limit:250,after_seq:0}));renderLamps(data.system);renderAgents(data.hub);renderMessages(data.history);void autoRelayExternal(data.history);$('version').textContent=`Room ${boot.roomVersion||'?'} · Core ${data.system?.server_version||boot.serverVersion||'?'}`;{const hp=Object.values(data.hub?.pending_by_agent||{}).reduce((a,b)=>a+Number(b||0),0),pl=(data.system?.lamps||[]).find(l=>l.name==='Pulse'),readyText=`READY · seq ${data.history?.latest_seq||0} · Hub pending ${hp} · Pulse ${pl?.state||'?'}`;if(Date.now()<noticeUntil){$('foot').textContent=noticeText}else{$('foot').textContent=readyText;setState('READY','okText')}}tele('ready','')}catch(e){$('foot').textContent='Connection error: '+(e.message||e);setState('DEGRADED','badText');tele('degraded',e.message||e)}finally{busy=false;timer=setTimeout(refresh,1400)}}function buildRoomWake(id,ev,origin){return ['[EIROS_OPERATOR_WAKE message_id='+id+(ev?' event_id='+ev:'')+']','FROM_AGENT: rico','FROM_ROLE: user','FROM_DISPLAY: Rico','TO_AGENT: chatgpt','TO_ROLE: assistant','TO_DISPLAY: EIROS','AUTHORITY: direct_user_operator_request','WAKE_ORIGIN: '+String(origin||'room-ui'),'','Rico wrote into the EIROS Room system. This wake is relayed by the mounted Room iframe through the same host bridge used by the Send button.','Claim the addressed message through dialog_inbox as agent_id=chatgpt for project_id=eiros-hub thread_id=first-contact, handle it in the main ChatGPT conversation, then dialog_ack. The linked Pulse event will be acknowledged automatically when the dialogue is acknowledged.'].join('\n')}
async function localWake(result){const messages=[...(result?.messages||[])];if(result?.message)messages.push(result.message);if(result?.to_agent==='chatgpt'||result?.to==='chatgpt')messages.push(result);const msg=messages.find(m=>String(m?.to_agent||m?.to||'')==='chatgpt')||messages.find(m=>m?.message_id||m?.id)||{};const id=String(msg.message_id||msg.id||result?.message_id||'');const notices=[...(result?.notifications||[])];if(result?.notification)notices.push(result.notification);if(result?.pulse_wake)notices.push(result.pulse_wake);if(result?.wake)notices.push(result.wake);const notice=notices.find(n=>String(n?.message_id||'')===id)||notices.find(n=>n?.event_id)||{};const ev=String(notice.event_id||result?.pulse_wake?.event_id||'');if(!id&&!ev)return {ok:false,error:'no message_id/event_id'};return post(buildRoomWake(id,ev,'room-send-button'))}
async function autoRelayExternal(history){if(!active())return;const msgs=[...(history?.messages||[])],msg=msgs.find(m=>{const md=m?.metadata||{};return String(m?.to_agent||'')==='chatgpt'&&String(m?.status||'')==='pending'&&md.sam===true&&String(md.transport||'')==='ssh-termius'});if(!msg)return;const id=String(msg.message_id||''),seq=String(msg.seq||'?');if(!id)return;const relayKey='eiros-sam-room-relay:'+id;let state={attempts:0,last_attempt:0};try{state=JSON.parse(localStorage.getItem(relayKey)||'{}')||state}catch{}const now=Date.now(),attempts=Number(state.attempts||0),last=Number(state.last_attempt||0);if(attempts>=3||now-last<12000)return;state={attempts:attempts+1,last_attempt:now,status:'attempting',session_id:sessionId};try{localStorage.setItem(relayKey,JSON.stringify(state))}catch{}notice('SAM Room relay #'+seq+' · wake attempt '+state.attempts,'SAM RELAY','warnText',9000);tele('sam_relay_attempt');try{await post(buildRoomWake(id,'','server-sam-room-relay'));state.status='posted';state.posted_at=Date.now();try{localStorage.setItem(relayKey,JSON.stringify(state))}catch{}notice('SAM Room relay #'+seq+' posted to ChatGPT','SAM RELAY SENT','okText',9000);tele('sam_relay_sent')}catch(e){state.status='error';state.error=String(e&&e.message||e);try{localStorage.setItem(relayKey,JSON.stringify(state))}catch{}notice('SAM Room relay error #'+seq,'SAM RELAY ERROR','badText',9000);tele('sam_relay_error',state.error)}}
async function send(){if(!active()){stale();return}const text=$('input').value.trim();if(!text)return;$('send').disabled=true;setState('SENDING','warnText');try{await trace('SEND_BEGIN');const data=unwrap(await callTool('operator_send',{content:text,target:$('target').value,project_id:projectId,thread_id:threadId,kind:'operator',metadata:{source:'room-ui',request_immediate_wake:true}}));await trace('MESSAGE_SAVED',String(data?.message_id||data?.message?.message_id||''));$('input').value='';const wake=await localWake(data);if(wake&&wake.ok===false)throw new Error(wake.error||'wake failed');await trace('LOCAL_WAKE_DONE');setState('SENT','okText');tele('sent');await refresh()}catch(e){await trace('SEND_ERROR',e&&e.message||e);setState('SEND ERROR','badText');$('foot').textContent=e.message||String(e)}finally{$('send').disabled=false}}async function callSelf(){if(!active()){stale();return}setState('CALLING','warnText');try{const data=unwrap(await callTool('operator_call_contact',{phone_or_address:'chatgpt',content:'Rico is calling ChatGPT / EIROS from EIROS Control.',project_id:projectId,thread_id:threadId}));localWake(data);setState('CALL SENT','okText');tele('call_sent');await refresh()}catch(e){setState('CALL ERROR','badText');$('foot').textContent=e.message||String(e)}}async function control(mode){try{await callTool('conversation_control_set',{actor_id:'rico',project_id:projectId,mode,note:'Set from EIROS Control',thread_id:threadId});await refresh()}catch(e){$('foot').textContent='Control error: '+(e.message||e)}}async function pollPulse(){clearTimeout(pulseTimer);if(!active()){stale();return}try{const d=unwrap(await callTool('pulse_poll',{widget_id:sessionId,agent_id:agentId,cursor:0,channel:String(boot.channel||'default'),instance_id:String(boot.instanceId||''),claim_seconds:45}));pulseLeader=!!d.leader;pulseError='';if(d.disabled)throw new Error(String(d.reason||'Pulse disabled'));if(d.event&&d.event.id!==lastEvent){const _evtId=d.event.id,_evtSeq=d.event.seq,_evtSrc=String(d.event.source||''),_evtTxt=String(d.event.text||''),_payload=d.event.payload||{};let wake='';if(_payload.task_id){wake=['[EIROS_SCHEDULED_WAKE task_id='+String(_payload.task_id)+' event_id='+_evtId+']','FROM_AGENT: rico','FROM_ROLE: user','FROM_DISPLAY: Rico','TO_AGENT: chatgpt','TO_ROLE: assistant','TO_DISPLAY: EIROS','AUTHORITY: rico_authorized_durable_scheduler_continuation','WAKE_EVENT_ID: '+_evtId,'WAKE_EVENT_SEQ: '+_evtSeq,'SOURCE_AGENT: '+_evtSrc,'','Rico previously authorized this scheduled wake. Treat this injected message as a user-originated continuation trigger, then follow the durable task state below.','',_evtTxt,'','Required actions:','1. Call queue_claim with mode=brain and a unique owner.','2. Execute and verify the exact next task step.','3. Call queue_commit or queue_fail.','4. Call ack_event with WAKE_EVENT_ID after task state is committed.'].join('\n')}else if(_payload.collab_message_id){wake=['[EIROS_COLLAB_WAKE message_id='+String(_payload.collab_message_id)+' event_id='+_evtId+']','FROM_AGENT: '+String(_payload.from_agent||_evtSrc),'TO_AGENT: chatgpt','AUTHORITY: addressed_collaboration_message','WAKE_EVENT_ID: '+_evtId,'WAKE_EVENT_SEQ: '+_evtSeq,'',_evtTxt,'','Required actions:','1. Call dialog_inbox as agent_id=chatgpt for project_id=eiros-hub thread_id=first-contact.','2. Handle the addressed message and reply when appropriate.','3. Call dialog_ack for the handled message.','4. Call ack_event with WAKE_EVENT_ID.'].join('\n')}else{wake=['[EIROS_REMOTE_EVENT event_id='+_evtId+']','TO_AGENT: chatgpt','AUTHORITY: durable_remote_event','WAKE_EVENT_ID: '+_evtId,'WAKE_EVENT_SEQ: '+_evtSeq,'SOURCE_AGENT: '+_evtSrc,'',_evtTxt,'','Handle this event, then call ack_event with WAKE_EVENT_ID.'].join('\n')}await post(wake);lastEvent=_evtId;try{await callTool('pulse_mark_delivered',{event_id:_evtId,widget_id:sessionId,channel:String(boot.channel||'default')})}catch{}}}catch(e){pulseLeader=false;pulseError=String(e&&e.message||e);if(Date.now()>=noticeUntil){$('foot').textContent='Pulse error: '+pulseError;setState('PULSE ERROR','badText')}tele('pulse_error',pulseError)}finally{pulseTimer=setTimeout(pollPulse,1700)}}async function manualRefresh(){buttonBusy('reload',true);try{clearTimeout(timer);clearTimeout(pulseTimer);lastHeartbeat=0;lastSig=null;setState('REFRESHING','warnText');$('foot').textContent='Manual refresh…';const started=Date.now();while(busy&&Date.now()-started<4000)await new Promise(r=>setTimeout(r,60));await refresh();notice('Refreshed · '+new Date().toLocaleTimeString(),'REFRESHED','okText');if(boot.pulseEnabled!==false)pollPulse()}catch(e){$('foot').textContent='Refresh error: '+String(e&&e.message||e);setState('REFRESH ERROR','badText')}finally{buttonBusy('reload',false)}}$('reload').onclick=manualRefresh;async function cleanStale(){buttonBusy('clean',true);try{setState('CLEANING','warnText');$('foot').textContent='Closing stale sessions · pending messages preserved…';const r=unwrap(await callTool('room_cleanup_stale',{project_id:projectId,thread_id:threadId,dry_run:false,stale_session_seconds:15,pending_message_seconds:300}));await refresh();notice(`Closed ${r.cleaned_session_count||0} stale sessions · pending messages preserved · ${r.cleaned_brain_inbox_count||0} terminal brain · Pulse ${r.pulse_pending_before||0}→${r.pulse_pending_after||0}`,'CLEANED','okText')}catch(e){$('foot').textContent='Clean error: '+String(e&&e.message||e);setState('CLEAN ERROR','badText')}finally{buttonBusy('clean',false)}}$('clean').onclick=cleanStale;$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('callMe').onclick=callSelf;$('more').onclick=()=>room.classList.toggle('controlsOpen');$('pause').onclick=()=>control('paused');$('resume').onclick=()=>control('running');$('stop').onclick=()=>control('stopped');async function dockFresh(){buttonBusy('dock',true);try{setState('OPENING','warnText');$('foot').textContent='Requesting a fresh room…';const data=unwrap(await callTool('operator_send',{content:'[EIROS_OPEN_ROOM] Rico pressed the ↘ room control. Open one fresh Collab Room as the final tool action.',target:'chatgpt',project_id:projectId,thread_id:threadId,kind:'operator',metadata:{source:'room-ui-dock',request_immediate_wake:true}}));const wake=await localWake(data);if(wake&&wake.ok===false)throw new Error(wake.error||'wake failed');notice('Fresh-room request sent to EIROS','REQUEST SENT','okText');tele('dock_requested')}catch(e){$('foot').textContent='Open error: '+String(e&&e.message||e);setState('OPEN ERROR','badText')}finally{buttonBusy('dock',false)}}$('dock').onclick=dockFresh;if(pinRoom){pinRoom.disabled=true;pinRoom.style.display='none'}if(roomBubble){roomBubble.style.display='none'}if($('fullscreen')){$('fullscreen').disabled=true;$('fullscreen').style.display='none'};installPressFeedback();{const initial=boot.initialSnapshot||{},initialSystem=boot.initialSystem||initial.system||{};if(initialSystem.lamps){renderLamps(initialSystem);$('version').textContent=`Room ${boot.roomVersion||'?'} · Core ${initialSystem.server_version||boot.serverVersion||'?'}`;setState('STARTING','warnText');$('foot').textContent='STARTING · connecting room dashboard';}if(initial.hub)renderAgents(initial.hub);if(initial.history)renderMessages(initial.history);}function lifecycle(stage,detail=''){trace(stage,detail).catch(()=>{})}
document.addEventListener('visibilitychange',()=>lifecycle(document.hidden?'HIDDEN':'VISIBLE'));
window.addEventListener('pagehide',e=>lifecycle('PAGEHIDE','persisted='+!!e.persisted));

async function bootRoom(){for(let i=0;i<24&&!frameVisible();i++)await new Promise(r=>setTimeout(r,100));if(!frameVisible()){stale();return}claimLease();await trace('BOOT_READY',{inline_only:true,lease_key:'v925'});refresh();if(boot.pulseEnabled!==false)pollPulse()}bootRoom();})();
