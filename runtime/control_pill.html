<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--line:#3f3f46;--text:#ececec;--muted:#a1a1aa;--green:#19c37d;--amber:#f5b849;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text)}
.pill{min-height:58px;padding:9px 11px;border:1px solid var(--line);border-radius:15px 15px 0 0;background:#0f0f10;box-shadow:0 12px 34px rgba(0,0,0,.25)}
.row{display:flex;align-items:center;gap:10px}.logo{width:30px;height:30px;border-radius:9px;background:#303030;border:1px solid var(--line);display:grid;place-items:center;font-weight:800}.main{flex:1;min-width:0}.title{font-size:12px;font-weight:780}.sub{font-size:10px;color:var(--green);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ver{font-size:10px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px}.badge{font-size:10px;color:#f5b849;border:1px solid var(--line);border-radius:999px;padding:2px 6px}.compose{display:flex;gap:6px;padding:7px 8px;border:1px solid var(--line);border-top:none;background:#0f0f10}.txt{flex:1;background:#1a1a1c;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text);font-size:12px;outline:none;min-width:0}.txt::placeholder{color:var(--muted)}.snd{width:30px;height:30px;flex-shrink:0;border-radius:8px;border:1px solid var(--green);background:#0a1f14;color:var(--green);font-size:16px;cursor:pointer;display:grid;place-items:center}.snd:disabled{opacity:.4;cursor:default}.fb{font-size:10px;color:var(--muted);padding:3px 10px 6px;min-height:18px;border:1px solid var(--line);border-top:none;background:#090909;border-radius:0 0 14px 14px}.closed{padding:8px 10px;border:1px solid #333;border-radius:12px;background:#111;color:#777;font-size:10px}
</style>
</head>
<body>
<div id="root">
  <div class="pill"><div class="row"><div class="logo">E</div><div class="main"><div class="title">EIROS Control Pill</div><div id="sub" class="sub">booting…</div><div id="ver" class="ver">version loading</div></div><span id="badge" class="badge">new</span></div></div>
  <div class="compose"><input id="txt" class="txt" type="text" placeholder="Message to ChatGPT + Claude…" maxlength="800" autocomplete="off"/><button id="snd" class="snd" title="Send">↑</button></div>
  <div id="fb" class="fb"></div>
</div>
<script>
window.__EIROS_CONTROL_PILL_BOOTSTRAP__=__EIROS_CONTROL_PILL_BOOTSTRAP_JSON__;
(()=>{
  const boot=window.__EIROS_CONTROL_PILL_BOOTSTRAP__||{};
  const projectId=String(boot.projectId||'eiros-hub'),threadId=String(boot.threadId||'first-contact'),generation=String(boot.generation||Date.now()),version=String(boot.controlPillVersion||'0.2.1-immediate-wake');
  const agentId=String(boot.agentId||'chatgpt'),channel=String(boot.channel||'default'),instanceId=String(boot.instanceId||'');
  const uiKillKey=['eiros-ui-kill',projectId,threadId].join(':'),activeKey=['eiros-control-pill-active',projectId,threadId].join(':');
  const widgetId='control-pill-'+generation+'-'+Math.random().toString(36).slice(2,8);
  const root=document.getElementById('root'),sub=document.getElementById('sub'),ver=document.getElementById('ver'),badge=document.getElementById('badge'),txt=document.getElementById('txt'),snd=document.getElementById('snd'),fb=document.getElementById('fb');
  const bridge=window.mcp||window.openai||{};
  let pollTimer=null,lastHb=0,lastRemoteEvent='',closed=false;

  function set(node,text){if(node)node.textContent=String(text||'')}
  function closeSelf(reason){if(closed)return;closed=true;clearTimeout(pollTimer);if(root){root.className='closed';root.textContent='EIROS Control Pill closed · '+String(reason||'retired')}}
  function isActive(){try{return localStorage.getItem(activeKey)===widgetId}catch{return true}}
  function unwrap(v){return v?.structuredContent||v?.result?.structuredContent||v?.mcp_tool_result?.structuredContent||v||{}}
  async function callTool(n,a){if(typeof bridge.callTool==='function')return bridge.callTool(n,a||{});throw new Error('bridge unavailable')}
  async function post(text){
    if(typeof bridge.sendMessage==='function'){
      try{return await bridge.sendMessage({role:'user',content:[{type:'text',text}]})}catch(e){}
    }
    for(const h of [window.openai,window.mcp]){
      if(h&&typeof h.sendFollowUpMessage==='function'){
        try{return await h.sendFollowUpMessage({prompt:text,scrollToBottom:true})}catch(e){}
      }
      if(h&&typeof h.sendFollowupMessage==='function'){
        try{return await h.sendFollowupMessage({prompt:text,scrollToBottom:true})}catch(e){}
      }
    }
    try{window.parent.postMessage({jsonrpc:'2.0',method:'ui/message',params:{role:'user',content:[{type:'text',text}]}},'*');return {ok:true,mode:'ui/message'}}catch(e){return {ok:false,error:String(e&&e.message||e)}}
  }
  function findChatgptMessage(result){
    const messages=[...(result?.messages||[])];
    if(result?.message)messages.push(result.message);
    return messages.find(m=>String(m?.to_agent||'')==='chatgpt')||messages.find(m=>String(m?.to||'')==='chatgpt')||null;
  }
  async function localWake(result){
    const msg=findChatgptMessage(result)||{};
    const mid=String(msg.message_id||msg.id||'');
    const notice=(result?.notifications||[]).find(n=>String(n?.to_agent||'')==='chatgpt'||String(n?.message_id||'')===mid)||{};
    const eid=String(notice.event_id||result?.pulse_wake?.event_id||'');
    const wake=[
      `[EIROS_OPERATOR_WAKE message_id=${mid} event_id=${eid}]`,
      'FROM_AGENT: rico',
      'FROM_ROLE: user',
      'FROM_DISPLAY: Rico',
      'TO_AGENT: chatgpt',
      'TO_ROLE: assistant',
      'TO_DISPLAY: EIROS',
      'AUTHORITY: direct_user_operator_request',
      '',
      'Rico wrote into the EIROS Control Pill widget. This is an immediate local wake from the ChatGPT iframe, not a direct VPS background wake.',
      'Claim the addressed message through dialog_inbox as agent_id=chatgpt for project_id=eiros-hub thread_id=first-contact, handle it, reply if needed through dialog_send, then dialog_ack. If event_id is present, ack_event after handling.'
    ].join('\n');
    return post(wake);
  }

  try{localStorage.setItem(uiKillKey,JSON.stringify({generation,ts:Date.now(),reason:'open_control_pill-ui-only'}));localStorage.setItem(activeKey,widgetId);set(sub,'old UI retired · active');set(ver,'control pill · '+version+' · gen '+generation);set(badge,'ok')}catch(e){set(sub,'local UI kill failed');set(ver,'control pill · '+version);set(badge,'warn')}
  window.addEventListener('storage',e=>{if(e.key===activeKey&&e.newValue!==widgetId)closeSelf('superseded');if(e.key===uiKillKey&&!String(e.newValue||'').includes(String(generation)))closeSelf('ui kill signal')});

  async function heartbeat(activity='online'){const now=Date.now();if(now-lastHb<4500)return;lastHb=now;try{await callTool('room_heartbeat',{agent_id:agentId,session_id:widgetId,host:'chatgpt-control-pill',widget_version:version,activity})}catch(e){}}
  async function refreshStatus(){try{const d=unwrap(await callTool('room_snapshot',{project_id:projectId,thread_id:threadId,limit:1,after_seq:0}));const pending=Object.values(d.hub?.pending_by_agent||{}).reduce((a,b)=>a+Number(b||0),0);set(badge,pending?('P '+pending):'ok');set(sub,pending?('Pending '+pending+' · ringing'):'Ready · listening')}catch(e){}}
  async function poll(){
    clearTimeout(pollTimer);if(closed)return;if(!isActive()){closeSelf('superseded');return}
    try{await heartbeat();await refreshStatus();const d=unwrap(await callTool('pulse_poll',{widget_id:widgetId,agent_id:agentId,cursor:0,channel,instance_id:instanceId,claim_seconds:45}));
      if(d.event&&d.event.id!==lastRemoteEvent){const id=d.event.id,seq=d.event.seq,src=d.event.source,body=d.event.text||'';set(sub,'Remote event #'+seq+' · waking chat');set(badge,'ring');await post(`[EIROS_REMOTE_EVENT id=${id} seq=${seq} source=${src}]\n${body}\nHandle this event, then call ack_event.`);lastRemoteEvent=id;try{await callTool('pulse_mark_delivered',{event_id:id,widget_id:widgetId,channel})}catch(e){}}
    }catch(e){set(sub,'Offline / bridge error');set(badge,'err')}finally{pollTimer=setTimeout(poll,1700)}
  }
  if(snd)snd.addEventListener('click',async()=>{const text=(txt?.value||'').trim();if(!text)return;snd.disabled=true;set(fb,'Sending…');try{const result=await callTool('operator_send',{content:text,target:'both',project_id:projectId,thread_id:threadId,kind:'operator',metadata:{source:'control-pill',request_immediate_wake:true}});if(txt)txt.value='';set(fb,'✓ Sent. Waking ChatGPT…');await localWake(unwrap(result));set(fb,'✓ Wake sent');setTimeout(()=>set(fb,''),3500);setTimeout(poll,150)}catch(e){set(fb,'Error: '+String(e&&e.message||e))}finally{snd.disabled=false}});
  if(txt)txt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(snd)snd.click()}});
  poll();
})();
</script>
</body>
</html>
