server {
    server_name 178-105-43-79.sslip.io;

    location /hub/mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /claude/mcp {
        proxy_pass http://127.0.0.1:8788/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8788;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # Generated capability URL. Never expose a generic /vps-ops/mcp route.
    location = /vps-ops-__VPS_OPS_CAPABILITY__/mcp {
        proxy_pass http://127.0.0.1:8790/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8790;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        access_log off;
    }

    location / {
        return 200 "EIROS Claude MCP alive\n";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/178-105-43-79.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/178-105-43-79.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = 178-105-43-79.sslip.io) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name 178-105-43-79.sslip.io;
    return 404;
}
