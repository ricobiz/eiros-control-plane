# Render __PORT__ and __PANEL_PREFIX__ during deployment.
# This snippet belongs inside the existing ebridge-ui HTTPS server block.

location ^~ /vault/s/ {
    proxy_pass http://127.0.0.1:__PORT__/s/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:__PORT__;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

location = __PANEL_PREFIX__ {
    return 302 __PANEL_PREFIX__/;
}

location ^~ __PANEL_PREFIX__/ {
    proxy_pass http://127.0.0.1:__PORT__/ui/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:__PORT__;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 2048m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
