name: EIROS OOB Recovery via ChatGPT GitHub MCP

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ebridge-out-of-band-recovery
  cancel-in-progress: false

jobs:
  issue-to-provider:
    # Fail closed: exact account owner and exact title prefix; no PR/untrusted scripts.
    if: >
      github.actor == 'ricobiz' &&
      github.event.issue.user.login == 'ricobiz' &&
      (github.event.issue.title == '[EIROS-OOB] status' ||
       github.event.issue.title == '[EIROS-OOB] graceful_reboot')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout audited recovery tooling
        uses: actions/checkout@v4
      - name: Inspect provider or perform explicitly confirmed graceful reboot
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/hetzner_issue_bridge.py
