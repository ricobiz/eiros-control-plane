name: EIROS Hetzner Out-of-Band Recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Status first. Reboot/reset requires manual approval and exact confirmation."
        required: true
        type: choice
        default: status
        options:
          - status
          - graceful_reboot
          - hard_reset
      confirmation:
        description: "Exact confirmation for reboot/reset (leave empty for status)"
        type: string
        required: false
      healthy_override:
        description: "I reviewed all hosted projects; allow reboot even if VAULT health responds"
        type: boolean
        required: true
        default: false
      second_reset_approval:
        description: "For hard reset only: IRREVERSIBLE_POWER_CYCLE"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ebridge-out-of-band-recovery
  cancel-in-progress: false

jobs:
  provider-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout independent recovery tooling
        uses: actions/checkout@v4
      - name: Diagnose or execute approved Hetzner action
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          OOB_ACTION: ${{ inputs.operation }}
          OOB_CONFIRMATION: ${{ inputs.confirmation }}
          OOB_OVERRIDE_HEALTHY: ${{ inputs.healthy_override }}
          OOB_SECOND_APPROVAL: ${{ inputs.second_reset_approval }}
        run: python3 ops/hetzner_oob.py
