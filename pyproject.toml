[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eiros-control-plane"
version = "0.2.0a1"
description = "Persistent event-driven control plane and reverse wake for ChatGPT MCP Apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==1.28.0"]

[project.scripts]
eiros = "runtime.cli:main"

[tool.setuptools]
packages = ["runtime", "runtime.musetalk_jobs", "root"]

[tool.setuptools.package-data]
runtime = ["*.html"]

[tool.pytest.ini_options]
# deploy/ holds operational probe scripts named test_*.py that open live TLS
# connections at import time. Collecting them aborted the whole suite with an
# SSL error, so the suite only ever ran when someone remembered --ignore=deploy.
testpaths = ["tests", "runtime", "root"]
